[package]
name = "lola_image_workbench"
version = "0.1.0"
description = "Native image workflow workbench for the LOLA Ren'Py game"
edition = "2021"

[lib]
name = "image_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
